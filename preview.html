<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupi Nephore Live Chat Preview</title>
    <link rel="stylesheet" href="./CSS/main.css">

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        min-height: 100%;
        overflow: auto;
        background: #151326 !important;
      }

      body {
        min-height: 100vh;
        padding-bottom: 104px;
        color: #f8f7ff;
      }

      input {
        font: inherit;
      }

      .preview-app {
        display: block;
        min-height: 100vh;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--rupi-pink);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 32px);
        line-height: 1.05;
      }

      .range-output {
        color: var(--rupi-soft-pink);
        font-size: 12px;
        font-weight: 900;
      }

      .preview-workspace {
        min-width: 0;
        padding: 28px clamp(12px, 4vw, 56px) 56px;
      }

      .workspace-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        width: min(100%, 760px);
        margin: 0 auto 14px;
      }

      .workspace-header h1 {
        margin: 0;
        font-size: clamp(21px, 4vw, 30px);
      }

      .workspace-header p {
        margin: 0;
        color: var(--rupi-periwinkle);
        font-size: 12px;
      }

      .preview-frame {
        --frame-width: 680px;

        position: relative;
        width: min(100%, var(--frame-width));
        min-height: 720px;
        margin: 0 auto;
        overflow: hidden;
        border: 2px solid rgb(169 173 226 / 34%);
        border-radius: 18px;
        background-color: #09090f;
        box-shadow: 0 22px 60px rgb(0 0 0 / 28%);
        transition: width 180ms ease, background 180ms ease;
      }

      .safe-area {
        position: absolute;
        inset: 12px;
        z-index: 0;
        border: 1px dashed rgb(233 101 164 / 34%);
        border-radius: 11px;
        pointer-events: none;
      }

      .safe-area::after {
        content: "batas viewport";
        position: absolute;
        top: 6px;
        right: 8px;
        color: rgb(245 181 210 / 55%);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .preview-feed {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        padding: 54px 8px 40px;
      }

      .preview-feed .rupi-chat,
      .preview-feed .rupi-event {
        flex: 0 0 auto;
      }

      .rupi-event__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .rupi-event__identity {
        min-width: 0;
      }

      .rupi-event__name {
        display: block;
        overflow: hidden;
        color: inherit;
        font-size: 14px;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rupi-event__meta {
        display: block;
        margin-top: 2px;
        color: inherit;
        font-size: 11px;
        font-weight: 800;
        opacity: 0.76;
      }

      .rupi-event__amount {
        flex: 0 0 auto;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--rupi-white);
        color: var(--rupi-berry);
        font-size: 12px;
        font-weight: 900;
      }

      .viewport-toolbar {
        position: fixed;
        z-index: 50;
        right: 50%;
        bottom: 18px;
        display: grid;
        grid-template-columns: auto minmax(180px, 430px) auto;
        align-items: center;
        gap: 14px;
        width: min(calc(100% - 24px), 720px);
        padding: 14px 18px;
        border: 1px solid rgb(169 173 226 / 34%);
        border-radius: 16px;
        background: rgb(36 34 67 / 94%);
        box-shadow: 0 16px 46px rgb(0 0 0 / 42%);
        backdrop-filter: blur(14px);
        transform: translateX(50%);
      }

      .viewport-toolbar label {
        color: var(--rupi-lavender);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .viewport-toolbar input {
        width: 100%;
        accent-color: var(--rupi-pink);
        cursor: pointer;
      }

      @media (max-width: 850px) {
        .preview-workspace {
          padding-inline: 12px;
        }
      }

      @media (max-width: 560px) {
        body {
          padding-bottom: 126px;
        }

        .workspace-header {
          display: block;
        }

        .workspace-header > p {
          margin-top: 8px;
        }

        .viewport-toolbar {
          bottom: 8px;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 8px 12px;
          padding: 11px 14px;
        }

        .viewport-toolbar label {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>

  <body>
    <main class="preview-app">
      <section class="preview-workspace">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Local design preview</p>
            <h1>Semua variasi Rupi Live Chat</h1>
          </div>
          <p>Badge dan icon status YouTube tidak disimulasikan.</p>
        </header>

        <div class="preview-frame" id="preview-frame" data-background="dark">
          <div class="safe-area" aria-hidden="true"></div>
          <div class="preview-feed" id="preview-feed" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="viewport-toolbar">
      <label for="frame-width">Lebar viewport</label>
      <input id="frame-width" name="frame-width" type="range" min="320" max="760" value="680" step="10">
      <output class="range-output" id="frame-width-output" for="frame-width">680 px</output>
    </footer>

    <script>
      const examples = {
        viewer: {
          name: "RupiViewer",
          message: "Halo Rupi! Desain live chat-nya lucu sekali 💜"
        },
        member: {
          name: "MemberRupi",
          message: "Senang bisa menjadi member dan mendukung stream ini!"
        },
        moderator: {
          name: "RupiModerator",
          message: "Selamat datang! Jangan lupa membaca peraturan live chat."
        },
        rupi: {
          name: "Rupi Nephore",
          message: "Terima kasih sudah datang ke stream hari ini ♡"
        },
        superchat: {
          name: "SuperSupporter",
          message: "Semangat streaming-nya, Rupi!",
          amount: "Rp50.000"
        },
        membership: {
          name: "NewRupiMember",
          message: "Baru saja bergabung menjadi member!"
        }
      };

      const frameWidthInput = document.querySelector("#frame-width");
      const frameWidthOutput = document.querySelector("#frame-width-output");
      const previewFrame = document.querySelector("#preview-frame");
      const previewFeed = document.querySelector("#preview-feed");

      function createChat(type, data) {
        const card = document.createElement("article");
        const identity = document.createElement("span");
        const name = document.createElement("span");
        const message = document.createElement("div");

        card.className = `rupi-chat rupi-chat--${type}`;
        identity.className = "rupi-chat__identity";
        name.className = "rupi-chat__name";
        message.className = "rupi-chat__message";
        name.textContent = data.name;
        message.textContent = data.message;
        identity.append(name);
        card.append(identity, message);

        return card;
      }

      function createEvent(type, data) {
        const card = document.createElement("article");
        const header = document.createElement("header");
        const identity = document.createElement("div");
        const name = document.createElement("span");
        const meta = document.createElement("span");
        const body = document.createElement("div");

        card.className = `rupi-event rupi-event--${type}`;
        header.className = "rupi-event__header";
        identity.className = "rupi-event__identity";
        name.className = "rupi-event__name";
        meta.className = "rupi-event__meta";
        body.className = "rupi-event__body";

        name.textContent = data.name;
        meta.textContent = type === "superchat" ? "mengirim Superchat" : "Welcome to the clinic!";
        body.textContent = data.message;
        identity.append(name, meta);
        header.append(identity);

        if (type === "superchat") {
          const amount = document.createElement("span");
          amount.className = "rupi-event__amount";
          amount.textContent = data.amount || "Rp50.000";
          header.append(amount);
        }

        card.append(header, body);
        return card;
      }

      function createCard(type, data) {
        if (type === "superchat" || type === "membership") {
          return createEvent(type, data);
        }

        return createChat(type, data);
      }

      function renderGallery() {
        const fragment = document.createDocumentFragment();

        Object.entries(examples).forEach(([type, data]) => {
          fragment.append(createCard(type, data));
        });

        previewFeed.replaceChildren(fragment);
      }

      function updateFrame() {
        const width = `${frameWidthInput.value}px`;
        previewFrame.style.setProperty("--frame-width", width);
        frameWidthOutput.value = width;
      }

      frameWidthInput.addEventListener("input", updateFrame);

      const query = new URLSearchParams(window.location.search);
      const requestedWidth = Number(query.get("width"));

      if (requestedWidth >= 320 && requestedWidth <= 760) {
        frameWidthInput.value = String(requestedWidth);
      }

      updateFrame();
      renderGallery();
    </script>
  </body>
</html>
