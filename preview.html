<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupi Nephore Live Chat Preview</title>
    <link rel="stylesheet" href="./CSS/main.css">

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        min-height: 100%;
        overflow: auto;
        background: #151326 !important;
      }

      body {
        min-height: 100vh;
        color: #f8f7ff;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .preview-app {
        display: grid;
        grid-template-columns: minmax(270px, 340px) minmax(0, 1fr);
        min-height: 100vh;
      }

      .control-panel {
        position: sticky;
        top: 0;
        z-index: 20;
        align-self: start;
        min-height: 100vh;
        padding: 26px;
        border-right: 1px solid rgb(169 173 226 / 22%);
        background:
          radial-gradient(circle at 20% 0%, rgb(233 101 164 / 16%), transparent 34%),
          linear-gradient(180deg, #242243, #19172e);
        box-shadow: 12px 0 34px rgb(0 0 0 / 20%);
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--rupi-pink);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 32px);
        line-height: 1.05;
      }

      .intro {
        margin: 12px 0 24px;
        color: var(--rupi-periwinkle);
        font-size: 13px;
        line-height: 1.55;
      }

      .field {
        display: grid;
        gap: 7px;
        margin-bottom: 16px;
      }

      .field[hidden] {
        display: none;
      }

      .field label {
        color: var(--rupi-lavender);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 2px solid rgb(169 173 226 / 26%);
        border-radius: 12px;
        outline: none;
        background: rgb(248 247 255 / 8%);
        color: var(--rupi-white);
        transition: border-color 160ms ease, background 160ms ease;
      }

      .field input,
      .field select {
        min-height: 43px;
        padding: 0 12px;
      }

      .field textarea {
        min-height: 94px;
        padding: 11px 12px;
        resize: vertical;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--rupi-pink);
        background: rgb(248 247 255 / 12%);
      }

      .field select option {
        background: var(--rupi-navy);
      }

      .range-output {
        color: var(--rupi-soft-pink);
        font-size: 12px;
        font-weight: 900;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 21px;
      }

      .button-group button {
        min-height: 42px;
        padding: 8px 11px;
        border: 2px solid var(--rupi-pink);
        border-radius: 12px;
        background: var(--rupi-pink);
        color: var(--rupi-white);
        cursor: pointer;
        font-size: 12px;
        font-weight: 900;
      }

      .button-group button.secondary {
        border-color: rgb(169 173 226 / 40%);
        background: transparent;
      }

      .button-group button:hover {
        filter: brightness(1.08);
      }

      .preview-workspace {
        min-width: 0;
        padding: 28px clamp(18px, 4vw, 56px) 56px;
      }

      .workspace-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        width: min(100%, 760px);
        margin: 0 auto 14px;
      }

      .workspace-header h2 {
        margin: 0;
        font-size: 17px;
      }

      .workspace-header p {
        margin: 0;
        color: var(--rupi-periwinkle);
        font-size: 12px;
      }

      .preview-frame {
        --frame-width: 680px;

        position: relative;
        width: min(100%, var(--frame-width));
        min-height: 720px;
        margin: 0 auto;
        overflow: hidden;
        border: 2px solid rgb(169 173 226 / 34%);
        border-radius: 18px;
        background-color: #09090f;
        box-shadow: 0 22px 60px rgb(0 0 0 / 28%);
        transition: width 180ms ease, background 180ms ease;
      }

      .preview-frame[data-background="checker"] {
        background-color: #cecbd8;
        background-image:
          linear-gradient(45deg, #aaa6b8 25%, transparent 25%),
          linear-gradient(-45deg, #aaa6b8 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #aaa6b8 75%),
          linear-gradient(-45deg, transparent 75%, #aaa6b8 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .preview-frame[data-background="light"] {
        background: #f4edf3;
      }

      .preview-frame[data-background="transparent"] {
        background-color: transparent;
        background-image:
          linear-gradient(45deg, #312e4b 25%, transparent 25%),
          linear-gradient(-45deg, #312e4b 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #312e4b 75%),
          linear-gradient(-45deg, transparent 75%, #312e4b 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .safe-area {
        position: absolute;
        inset: 12px;
        z-index: 0;
        border: 1px dashed rgb(233 101 164 / 34%);
        border-radius: 11px;
        pointer-events: none;
      }

      .safe-area::after {
        content: "batas viewport";
        position: absolute;
        top: 6px;
        right: 8px;
        color: rgb(245 181 210 / 55%);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .preview-feed {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        padding: 54px 8px 40px;
      }

      .preview-feed .rupi-chat,
      .preview-feed .rupi-event {
        flex: 0 0 auto;
      }

      .rupi-event__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .rupi-event__identity {
        min-width: 0;
      }

      .rupi-event__name {
        display: block;
        overflow: hidden;
        color: inherit;
        font-size: 14px;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rupi-event__meta {
        display: block;
        margin-top: 2px;
        color: inherit;
        font-size: 11px;
        font-weight: 800;
        opacity: 0.76;
      }

      .rupi-event__amount {
        flex: 0 0 auto;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--rupi-white);
        color: var(--rupi-berry);
        font-size: 12px;
        font-weight: 900;
      }

      .empty-note {
        margin: 100px auto;
        color: var(--rupi-periwinkle);
        text-align: center;
      }

      @media (max-width: 850px) {
        .preview-app {
          grid-template-columns: 1fr;
        }

        .control-panel {
          position: static;
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid rgb(169 173 226 / 22%);
        }

        .preview-workspace {
          padding-inline: 12px;
        }
      }
    </style>
  </head>

  <body>
    <main class="preview-app">
      <aside class="control-panel">
        <p class="eyebrow">Local design tester</p>
        <h1>Rupi Live Chat</h1>
        <p class="intro">
          Ubah data di bawah untuk melihat hasil CSS secara langsung. Halaman ini tidak
          mengambil data dari YouTube, sehingga badge dan icon status tidak disimulasikan.
        </p>

        <form id="preview-form">
          <div class="field">
            <label for="type">Jenis pesan</label>
            <select id="type" name="type">
              <option value="viewer">Viewer / subscriber biasa</option>
              <option value="member">YouTube Member</option>
              <option value="moderator">Moderator</option>
              <option value="rupi">Rupi / channel owner</option>
              <option value="superchat">Superchat</option>
              <option value="membership">Notifikasi member baru</option>
            </select>
          </div>

          <div class="field">
            <label for="name">Nama pengguna</label>
            <input id="name" name="name" type="text" value="RupiViewer" maxlength="60">
          </div>

          <div class="field">
            <label for="message">Isi pesan</label>
            <textarea id="message" name="message" maxlength="400">Halo Rupi! Desain live chat-nya lucu sekali 💜</textarea>
          </div>

          <div class="field" id="amount-field" hidden>
            <label for="amount">Nominal superchat</label>
            <input id="amount" name="amount" type="text" value="Rp50.000" maxlength="30">
          </div>

          <div class="field">
            <label for="background">Background pengujian</label>
            <select id="background" name="background">
              <option value="dark">Gelap</option>
              <option value="light">Terang</option>
              <option value="checker">Checker</option>
              <option value="transparent">Simulasi transparan</option>
            </select>
          </div>

          <div class="field">
            <label for="frame-width">Lebar viewport</label>
            <input id="frame-width" name="frame-width" type="range" min="320" max="760" value="680" step="10">
            <output class="range-output" id="frame-width-output" for="frame-width">680 px</output>
          </div>

          <div class="button-group">
            <button type="button" id="show-all">Tampilkan semua</button>
            <button class="secondary" type="button" id="show-current">Preview aktif</button>
          </div>
        </form>
      </aside>

      <section class="preview-workspace">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Output</p>
            <h2 id="preview-title">Viewer / subscriber biasa</h2>
          </div>
          <p>Garis putus-putus menunjukkan batas aman.</p>
        </header>

        <div class="preview-frame" id="preview-frame" data-background="dark">
          <div class="safe-area" aria-hidden="true"></div>
          <div class="preview-feed" id="preview-feed" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script>
      const examples = {
        viewer: {
          label: "Viewer / subscriber biasa",
          name: "RupiViewer",
          message: "Halo Rupi! Desain live chat-nya lucu sekali 💜"
        },
        member: {
          label: "YouTube Member",
          name: "MemberRupi",
          message: "Senang bisa menjadi member dan mendukung stream ini!"
        },
        moderator: {
          label: "Moderator",
          name: "RupiModerator",
          message: "Selamat datang! Jangan lupa membaca peraturan live chat."
        },
        rupi: {
          label: "Rupi / channel owner",
          name: "Rupi Nephore",
          message: "Terima kasih sudah datang ke stream hari ini ♡"
        },
        superchat: {
          label: "Superchat",
          name: "SuperSupporter",
          message: "Semangat streaming-nya, Rupi!",
          amount: "Rp50.000"
        },
        membership: {
          label: "Notifikasi member baru",
          name: "NewRupiMember",
          message: "Baru saja bergabung menjadi member!"
        }
      };

      const form = document.querySelector("#preview-form");
      const typeInput = document.querySelector("#type");
      const nameInput = document.querySelector("#name");
      const messageInput = document.querySelector("#message");
      const amountInput = document.querySelector("#amount");
      const amountField = document.querySelector("#amount-field");
      const backgroundInput = document.querySelector("#background");
      const frameWidthInput = document.querySelector("#frame-width");
      const frameWidthOutput = document.querySelector("#frame-width-output");
      const previewFrame = document.querySelector("#preview-frame");
      const previewFeed = document.querySelector("#preview-feed");
      const previewTitle = document.querySelector("#preview-title");
      const showAllButton = document.querySelector("#show-all");
      const showCurrentButton = document.querySelector("#show-current");

      let galleryMode = false;

      function createChat(type, data) {
        const card = document.createElement("article");
        const identity = document.createElement("span");
        const name = document.createElement("span");
        const message = document.createElement("div");

        card.className = `rupi-chat rupi-chat--${type}`;
        identity.className = "rupi-chat__identity";
        name.className = "rupi-chat__name";
        message.className = "rupi-chat__message";
        name.textContent = data.name;
        message.textContent = data.message;
        identity.append(name);
        card.append(identity, message);

        return card;
      }

      function createEvent(type, data) {
        const card = document.createElement("article");
        const header = document.createElement("header");
        const identity = document.createElement("div");
        const name = document.createElement("span");
        const meta = document.createElement("span");
        const body = document.createElement("div");

        card.className = `rupi-event rupi-event--${type}`;
        header.className = "rupi-event__header";
        identity.className = "rupi-event__identity";
        name.className = "rupi-event__name";
        meta.className = "rupi-event__meta";
        body.className = "rupi-event__body";

        name.textContent = data.name;
        meta.textContent = type === "superchat" ? "mengirim Superchat" : "Welcome to the clinic!";
        body.textContent = data.message;
        identity.append(name, meta);
        header.append(identity);

        if (type === "superchat") {
          const amount = document.createElement("span");
          amount.className = "rupi-event__amount";
          amount.textContent = data.amount || "Rp50.000";
          header.append(amount);
        }

        card.append(header, body);
        return card;
      }

      function createCard(type, data) {
        if (type === "superchat" || type === "membership") {
          return createEvent(type, data);
        }

        return createChat(type, data);
      }

      function currentData() {
        return {
          name: nameInput.value.trim() || "Anonymous",
          message: messageInput.value.trim() || "Pesan kosong",
          amount: amountInput.value.trim() || "Rp50.000"
        };
      }

      function renderCurrent() {
        const type = typeInput.value;
        galleryMode = false;
        previewFeed.replaceChildren(createCard(type, currentData()));
        previewTitle.textContent = examples[type].label;
        amountField.hidden = type !== "superchat";
      }

      function renderGallery() {
        const fragment = document.createDocumentFragment();

        Object.entries(examples).forEach(([type, data]) => {
          fragment.append(createCard(type, data));
        });

        galleryMode = true;
        previewFeed.replaceChildren(fragment);
        previewTitle.textContent = "Semua variasi";
      }

      function updateFrame() {
        const width = `${frameWidthInput.value}px`;
        previewFrame.style.setProperty("--frame-width", width);
        frameWidthOutput.value = width;
        previewFrame.dataset.background = backgroundInput.value;
      }

      typeInput.addEventListener("change", () => {
        const selected = examples[typeInput.value];
        nameInput.value = selected.name;
        messageInput.value = selected.message;
        amountInput.value = selected.amount || amountInput.value;
        renderCurrent();
      });

      form.addEventListener("input", (event) => {
        if (event.target === frameWidthInput || event.target === backgroundInput) {
          updateFrame();
          return;
        }

        if (!galleryMode) {
          renderCurrent();
        }
      });

      backgroundInput.addEventListener("change", updateFrame);
      showAllButton.addEventListener("click", renderGallery);
      showCurrentButton.addEventListener("click", renderCurrent);

      const query = new URLSearchParams(window.location.search);
      const requestedWidth = Number(query.get("width"));

      if (requestedWidth >= 320 && requestedWidth <= 760) {
        frameWidthInput.value = String(requestedWidth);
      }

      updateFrame();
      if (query.has("all")) {
        renderGallery();
      } else {
        renderCurrent();
      }
    </script>
  </body>
</html>
